<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UNIVEN Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ===================================================================
   DESIGN TOKENS
=================================================================== */
:root{
  --green:#0b1f3a;
  --green-dark:#071328;
  --green-mid:#12305c;
  --green-light:#eef1f7;
  --gold:#e0932c;
  --gold-light:#fdf1e2;
  --bg:#f4f7f5;
  --surface:#ffffff;
  --surface-2:#fbfcfb;
  --text:#12211a;
  --text-soft:#5c6b63;
  --text-faint:#94a39c;
  --border:#e5ece8;
  --danger:#e0464b;
  --danger-light:#fdecec;
  --success:#1fae6b;
  --success-light:#e7f8ef;
  --warn:#b8860b;
  --warn-light:#fbf2df;
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:30px;--r-pill:999px;
  --shadow-sm:0 3px 10px rgba(11,31,58,.06);
  --shadow-md:0 10px 28px rgba(11,31,58,.11);
  --shadow-lg:0 22px 54px rgba(11,31,58,.20);
  --glass-bg:rgba(255,255,255,.62);
  --glass-border:rgba(255,255,255,.55);
  --nav-h:78px;
}
[data-theme="dark"]{
  --bg:black;
  --surface:black;
  --surface-2:#0f1b15;
  --text:#eef5f1;
  --text-soft:#a3b5ac;
  --text-faint:#6d8177;
  --border:#20342a;
  --green-light:#123322;
  --gold-light:#2b2716;
  --danger-light:#331515;
  --success-light:#0f2c1e;
  --warn-light:#2c2410;
  --glass-bg:rgba(19,31,25,.62);
  --glass-border:rgba(255,255,255,.08);
  --shadow-sm:0 2px 8px rgba(0,0,0,.25);
  --shadow-md:0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 18px 48px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:15px;}
body{
  font-family:'Inter',sans-serif;
  background:#dfe6e2;
  color:var(--text);
  min-height:100vh;
}
[data-theme="dark"] body{background:#050a07;}
h1,h2,h3,h4,.poppins{font-family:'Poppins',sans-serif;}
button,input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:0;height:0;}

/* ===================================================================
   PHONE FRAME
=================================================================== */
.frame{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  overflow-x:hidden;
  transition:background .3s ease;
}
@media (min-width:460px){
  body{padding:18px 0;}
  .frame{min-height:calc(100vh - 36px);border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;}
}

.screen{display:none;min-height:100%;}
.screen.active{display:block;animation:screenIn .32s cubic-bezier(.2,.8,.3,1);}
.screen:not(.active){display:none!important;}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ===================================================================
   SPLASH
=================================================================== */
#splash-screen{
  position:relative;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:white;
  background-image:url("https://i.ibb.co/fYQtc6Gk/122e8e91-764c-4747-a6ae-2f7127ec53d8.png");
  color:#fff;overflow:hidden;
  background-size:100%;
}
#splash-screen::before{
  content:'';position:absolute;inset:0;
  
}
.splash-crest{
  width:92px;height:92px;border-radius:24px;background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 32px rgba(0,0,0,.3);margin-bottom:18px;
  animation:crestPop .7s cubic-bezier(.2,1.4,.4,1) both;
  position:relative;z-index:1;
}
.splash-crest img{width:64px;height:64px;object-fit:contain;}
@keyframes crestPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.splash-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.6rem;letter-spacing:.5px;position:relative;z-index:1;animation:fadeUp .6s .15s both;}
.splash-title span{color:var(--gold);}
.splash-sub{font-size:.82rem;opacity:.8;margin-top:6px;letter-spacing:1.5px;text-transform:uppercase;position:relative;z-index:1;animation:fadeUp .6s .25s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.splash-loader{
  margin-top:40px;width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);
  overflow:hidden;position:relative;z-index:1;
}
.splash-loader::after{
  content:'';position:absolute;left:-40%;top:0;height:100%;width:40%;border-radius:4px;
  background:linear-gradient(90deg,var(--gold),#fff);
  animation:loaderSlide 1.1s ease-in-out infinite;
}
@keyframes loaderSlide{0%{left:-40%}100%{left:100%}}

/* ===================================================================
   TOP BARS / HEADERS
=================================================================== */
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
}
.topbar h2{font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:var(--r-pill);border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-soft);transition:all .18s ease;font-size:.92rem;
  color:#FA6632 ;
}
.icon-btn:hover{border-color:var(--green);color:var(--green);}
.icon-btn:active{transform:scale(.92);}

.page-pad{padding:18px 18px 24px;}

/* ===================================================================
   GENERIC AUTH / ROLE SELECT
=================================================================== */
.auth-screen{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;
  
}
.auth-hero{
  background:linear-gradient(160deg,var(--green) 0%,var(--green-dark) 100%);
  padding:52px 24px 100px;color:#fff;position:relative;overflow:hidden;
  background-image:url("https://i.ibb.co/QZC2JH3/file-00000000e9d471f4af794bc4c0b448a5.png"); 
  background-size:100%;
}
.auth-hero::after{
  content:'';position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  background:rgba(201,162,39,.22);
}
.auth-hero .crest-sm{width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:var(--shadow-md);}
.auth-hero .crest-sm img{width:32px;height:32px;object-fit:contain;}
.auth-hero h1{font-size:1.5rem;font-weight:800;position:relative;z-index:1;}
.auth-hero p{font-size:.85rem;opacity:.85;margin-top:4px;position:relative;z-index:1;}

.role-cards{padding:22px 20px;display:flex;flex-direction:column;gap:14px;flex:1;}
.role-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:20px;display:flex;align-items:center;gap:16px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.role-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--green);}
.role-card .r-icon{
  width:52px;height:52px;border-radius:var(--r-md);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff;
}
.role-card.student .r-icon{background:linear-gradient(135deg,var(--green-mid),var(--green));}
.role-card.lecturer .r-icon{background:linear-gradient(135deg,var(--gold),#a9821c);}
.role-card h3{font-size:1rem;font-weight:700;margin-bottom:2px;}
.role-card p{font-size:.78rem;color:var(--text-soft);}
.role-card .chevron{margin-left:auto;color:var(--text-faint);}

.form-card{background:var(--surface);border-radius:var(--r-lg);padding:24px 20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin:18px 20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.76rem;font-weight:600;color:var(--text-soft);margin-bottom:6px;letter-spacing:.2px;}
.field .input-wrap{position:relative;}
.field .input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:.85rem;}
.input{
  width:100%;height:46px;border-radius:var(--r-sm);border:1.5px solid var(--border);
  background:var(--surface-2);padding:0 14px 0 38px;font-size:.9rem;color:var(--text);
  outline:none;transition:border-color .18s ease,background .18s ease;
}
.input:focus{border-color:var(--green);background:var(--surface);}
.input.no-icon{padding-left:14px;}
textarea.input{height:auto;padding-top:10px;}
.select{
  width:100%;height:46px;border-radius:var(--r-sm);border:1.5px solid var(--border);
  background:var(--surface-2);padding:0 14px;font-size:.9rem;color:var(--text);outline:none;cursor:pointer;
}
.select:focus{border-color:var(--green);}

.btn{
  width:100%;height:48px;border-radius:var(--r-sm);border:none;cursor:pointer;
  font-size:.9rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;font-family:'Inter',sans-serif;
}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--green-mid),var(--green-dark));color:#fff;box-shadow:0 10px 24px rgba(0,102,51,.28);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#a9821c);color:#fff;box-shadow:0 10px 24px rgba(201,162,39,.28);}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1.5px solid var(--border);}
.btn-danger{background:var(--danger-light);color:var(--danger);}
.btn-sm{height:38px;font-size:.8rem;border-radius:var(--r-xs);}

.divider-text{text-align:center;color:var(--text-faint);font-size:.78rem;margin:16px 0;position:relative;}
.divider-text::before,.divider-text::after{content:'';position:absolute;top:50%;width:38%;height:1px;background:var(--border);}
.divider-text::before{left:0;}.divider-text::after{right:0;}

.link-row{text-align:center;font-size:.8rem;color:var(--text-soft);margin-top:14px;}
.link-row b{color:var(--green);cursor:pointer;}

.tab-switch{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:4px;margin-bottom:18px;gap:4px;}
.tab-switch button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-size:.84rem;font-weight:700;color:var(--text-soft);cursor:pointer;transition:all .18s ease;}
.tab-switch button.active{background:var(--green);color:#fff;}

.confirm-chip{
  margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--success-light);color:var(--success);
  border-radius:var(--r-sm);padding:10px 12px;font-size:.8rem;font-weight:700;
}
.confirm-chip.warn{background:var(--warn-light);color:var(--warn);}
.confirm-chip{transition:background .2s ease,color .2s ease;}

/* ===================================================================
   STATUS / TOAST
=================================================================== */
.status-msg{
  margin-top:14px;padding:11px 14px;border-radius:var(--r-sm);font-size:.82rem;font-weight:600;display:none;
  align-items:center;gap:8px;
}
.status-msg.show{display:flex;}
.status-msg.success{background:var(--success-light);color:var(--success);}
.status-msg.error{background:var(--danger-light);color:var(--danger);}
.status-msg.info{background:var(--green-light);color:var(--green);}

#toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:#fff;padding:12px 20px;border-radius:var(--r-pill);
  font-size:.82rem;font-weight:600;z-index:999;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.3,1);
  display:flex;align-items:center;gap:8px;max-width:88%;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.success{background:var(--success);}
#toast.error{background:var(--danger);}

/* ===================================================================
   BOTTOM NAV
=================================================================== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;
  height:var(--nav-h);background:var(--glass-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border);display:flex;z-index:80;
  padding-bottom:14px;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--text-faint);cursor:pointer;font-size:.66rem;font-weight:600;position:relative;
  transition:color .2s ease;
}
.nav-item i{font-size:1.05rem;transition:transform .2s ease;}
.nav-item.active{color:var(--green);}
.nav-item.active i{transform:translateY(-2px);}
.nav-item .nav-dot{position:absolute;top:2px;right:26%;width:7px;height:7px;border-radius:50%;background:var(--danger);display:none;}
.nav-item .nav-dot.show{display:block;}
.nav-fab{
  width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--green-mid),var(--green-dark));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;
  margin-top:-26px;box-shadow:0 10px 24px rgba(0,102,51,.4);border:4px solid var(--bg);
}

/* ===================================================================
   STUDENT HOME
=================================================================== */
.greet-card{
  margin:14px 18px 0;padding:20px;
padding-bottom:50px;
  border-radius:var(--r-lg);color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--green) 0%,var(--green-dark) 100%);
  background-image:url("https://i.ibb.co/QZC2JH3/file-00000000e9d471f4af794bc4c0b448a5.png");
  background-size:100%;
}
.greet-card::after{content:'';position:absolute;right:-40px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:rgba(201,162,39,.18);}
.greet-card .hi{font-size:.78rem;opacity:.8;}
.greet-card h2{font-size:1.15rem;font-weight:700;margin-top:2px;}
.greet-ring-row{display:flex;align-items:center;gap:16px;margin-top:16px;position:relative;z-index:1;}
.ring{width:64px;height:64px;border-radius:50%;position:relative;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:800;font-family:'Poppins',sans-serif;}
.greet-stats{display:flex;gap:18px;font-size:.74rem;opacity:.9;}
.greet-stats b{display:block;font-family:'Poppins',sans-serif;font-size:1rem;}

.pwd-nudge{
  margin:14px 18px 0;background:var(--warn-light);color:var(--warn);border-radius:var(--r-md);
  padding:12px 14px;font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer;
}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 18px 10px;}
.section-title h3{font-size:.95rem;font-weight:700;}
.section-title .see-all{font-size:.76rem;color:var(--green);font-weight:600;cursor:pointer;}

.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x mandatory;}
.class-card{
  scroll-snap-align:start;min-width:220px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow-sm);
}
.class-card .tag{display:inline-block;font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);background:var(--green-light);color:var(--green);margin-bottom:8px;}
.class-card .tag.now{background:var(--warn-light);color:var(--warn);}
.class-card h4{font-size:.88rem;font-weight:700;margin-bottom:2px;}
.class-card .meta{font-size:.72rem;color:var(--text-soft);display:flex;align-items:center;gap:5px;margin-top:3px;}

.announce-card{
  margin:0 18px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:14px;display:flex;gap:12px;box-shadow:var(--shadow-sm);
}
.announce-card .a-icon{width:38px;height:38px;border-radius:var(--r-xs);background:var(--gold-light);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.announce-card h4{font-size:.85rem;font-weight:700;margin-bottom:2px;}
.announce-card p{font-size:.76rem;color:var(--text-soft);line-height:1.4;}
.announce-card .time{font-size:.68rem;color:var(--text-faint);margin-top:4px;display:block;}

.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 18px;}
.qa-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:14px 6px;text-align:center;cursor:pointer;transition:transform .15s ease;box-shadow:var(--shadow-sm);
}
.qa-btn:active{transform:scale(.94);}
.qa-btn i{font-size:1.15rem;color:var(--green);margin-bottom:6px;}
.qa-btn span{display:block;font-size:.66rem;font-weight:600;color:var(--text-soft);}

/* ===================================================================
   SCAN SCREEN
=================================================================== */
.scan-wrap{background:#080d16;min-height:100vh;color:#fff;position:relative;}
.scan-wrap .topbar{background:rgba(11,20,16,.7);border-color:rgba(255,255,255,.08);}
.scan-wrap .topbar h2{color:#fff;}
.scan-wrap .icon-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);color:#fff;}
#reader{width:100%;}
.camera-stage{
  position:relative;width:100%;aspect-ratio:3/4;background:#000;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.scan-frame{
  position:absolute;width:70%;aspect-ratio:1/1;
}
.scan-frame .corner{position:absolute;width:32px;height:32px;border:3px solid var(--gold);}
.scan-frame .c1{top:0;left:0;border-right:none;border-bottom:none;border-radius:10px 0 0 0;}
.scan-frame .c2{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 10px 0 0;}
.scan-frame .c3{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 10px;}
.scan-frame .c4{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 10px 0;}
.scan-line{
  position:absolute;left:4%;right:4%;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:scanMove 2.1s ease-in-out infinite;box-shadow:0 0 12px 1px rgba(201,162,39,.7);
}
@keyframes scanMove{0%{top:4%}50%{top:96%}100%{top:4%}}
.scan-hint{text-align:center;padding:20px;font-size:.85rem;color:rgba(255,255,255,.75);}
.scan-step-pill{
  display:inline-flex;margin:14px auto 0;padding:5px 14px;border-radius:var(--r-pill);
  background:rgba(224,147,44,.18);color:var(--gold);font-size:.7rem;font-weight:700;
}
.scan-step-row{text-align:center;}
.scan-manual{margin:0 20px;}
.scan-result-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(3px);
}
.scan-result-overlay.hidden{display:none;}
.result-card{
  background:var(--surface);border-radius:var(--r-xl);padding:32px 26px;text-align:center;width:86%;max-width:340px;
  box-shadow:var(--shadow-lg);animation:resultPop .35s cubic-bezier(.2,1.3,.4,1);
}
@keyframes resultPop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
.result-icon{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 16px;}
.result-icon.ok{background:var(--success-light);color:var(--success);}
.result-icon.warn{background:var(--warn-light);color:var(--warn);}
.result-icon.fail{background:var(--danger-light);color:var(--danger);}
.result-card h3{font-size:1.1rem;font-weight:800;margin-bottom:6px;}
.result-card p{font-size:.85rem;color:var(--text-soft);line-height:1.5;margin-bottom:20px;}

/* ===================================================================
   HISTORY
=================================================================== */
.filter-chips{display:flex;gap:8px;padding:14px 18px 4px;overflow-x:auto;}
.chip{
  padding:7px 14px;border-radius:var(--r-pill);font-size:.76rem;font-weight:600;white-space:nowrap;
  background:var(--surface);border:1.5px solid var(--border);color:var(--text-soft);cursor:pointer;transition:all .18s ease;
}
.chip.active{background:var(--green);color:#fff;border-color:var(--green);}

.history-item{
  margin:0 18px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:14px;display:flex;gap:12px;box-shadow:var(--shadow-sm);
}
.history-item .h-date{
  width:46px;flex-shrink:0;text-align:center;background:var(--green-light);border-radius:var(--r-xs);padding:6px 2px;
}
.history-item .h-date .d{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.05rem;color:var(--green);line-height:1;}
.history-item .h-date .m{font-size:.62rem;color:var(--green);text-transform:uppercase;letter-spacing:.4px;}
.history-item h4{font-size:.88rem;font-weight:700;}
.history-item .meta{font-size:.73rem;color:var(--text-soft);margin-top:2px;line-height:1.5;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);margin-top:6px;}
.badge.present{background:var(--success-light);color:var(--success);}
.badge.absent{background:var(--danger-light);color:var(--danger);}
.badge.late{background:var(--warn-light);color:var(--warn);}

/* ===================================================================
   NOTIFICATIONS
=================================================================== */
.notif-item{
  margin:0 18px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:14px;display:flex;gap:12px;box-shadow:var(--shadow-sm);position:relative;
}
.notif-item.unread::before{content:'';position:absolute;left:6px;top:20px;width:7px;height:7px;border-radius:50%;background:var(--gold);}
.notif-item .n-icon{width:38px;height:38px;border-radius:50%;background:var(--green-light);color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ===================================================================
   PROFILE
=================================================================== */
.profile-hero{
 
  background-image:url("https://i.ibb.co/QZC2JH3/file-00000000e9d471f4af794bc4c0b448a5.png"); 
  background-size:100%;
  padding-bottom:50px;
  text-align:center;border-radius:0 0 30px 30px;position:relative;
}
.avatar{
  width:82px;height:82px;border-radius:50%;background:var(--gold);color:#fff;font-family:'Poppins',sans-serif;
  font-weight:800;font-size:1.7rem;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;
  border:4px solid rgba(255,255,255,.3);
}
.profile-hero h2{font-size:1.1rem;font-weight:700;color:#4169E1 ;}
.profile-hero p{font-size:.78rem;opacity:.8;margin-top:2px;color:#4169E1;}
.profile-stats{
  display:flex;gap:10px;margin:-38px 18px 0;position:relative;z-index:2;
}
.pstat{flex:1;background:var(--surface);border-radius:var(--r-md);padding:14px 6px;text-align:center;box-shadow:var(--shadow-md);}
.pstat b{display:block;font-family:'Poppins',sans-serif;font-size:1.15rem;color:var(--green);}
.pstat span{font-size:.65rem;color:var(--text-soft);}

.settings-list{margin:20px 18px;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--border);overflow:hidden;}
.settings-row{
  display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;
}
.settings-row:last-child{border-bottom:none;}
.settings-row i{width:20px;color:var(--text-soft);}
.settings-row span{flex:1;font-size:.86rem;font-weight:500;}
.settings-row .chev{color:var(--text-faint);}
.toggle{width:42px;height:24px;border-radius:var(--r-pill);background:var(--border);position:relative;cursor:pointer;transition:background .2s ease;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s ease;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.toggle.on .knob{transform:translateX(18px);}

/* ===================================================================
   LECTURER DASHBOARD
=================================================================== */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 18px;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease;}
.stat-box:active{transform:scale(.97);}
.stat-box .s-icon{width:34px;height:34px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:.9rem;}
.stat-box b{display:block;font-family:'Poppins',sans-serif;font-size:1.35rem;}
.stat-box span{font-size:.72rem;color:var(--text-soft);}

.chart-card{margin:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-sm);}
.chart-card h4{font-size:.88rem;font-weight:700;margin-bottom:12px;}
.chart-card canvas{max-height:170px;}

.session-row{
  margin:0 18px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:14px;box-shadow:var(--shadow-sm);cursor:pointer;transition:border-color .15s ease;
}
.session-row:hover{border-color:var(--green);}
.session-row .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.session-row h4{font-size:.88rem;font-weight:700;}
.session-row .meta{font-size:.73rem;color:var(--text-soft);}
.session-status{font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);}
.session-status.live{background:var(--success-light);color:var(--success);}
.session-status.ended{background:var(--border);color:var(--text-soft);}

/* ===================================================================
   CREATE SESSION
=================================================================== */
.expire-select{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.expire-opt{
  text-align:center;padding:10px 4px;border-radius:var(--r-sm);border:1.5px solid var(--border);
  font-size:.78rem;font-weight:700;cursor:pointer;color:var(--text-soft);background:var(--surface-2);
}
.expire-opt.active{background:var(--green);color:#fff;border-color:var(--green);}

.qr-panel{
  margin:18px 20px;background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);
  padding:24px;text-align:center;box-shadow:var(--shadow-md);
}
#qrcode-box{display:inline-block;padding:14px;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-sm);}
.qr-timer{
  margin-top:16px;font-family:'Poppins',sans-serif;font-size:1.6rem;font-weight:800;color:var(--green);
}
.qr-timer.expiring{color:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.qr-meta{font-size:.78rem;color:var(--text-soft);margin-top:6px;}

/* ===================================================================
   ACTIVE CLASSES (student)
=================================================================== */
.empty{text-align:center;padding:50px 24px;}
.empty i{font-size:2.6rem;color:var(--text-faint);margin-bottom:12px;}
.empty h4{font-size:.95rem;font-weight:700;margin-bottom:4px;}
.empty p{font-size:.8rem;color:var(--text-soft);}

/* ===================================================================
   STUDENT LIST (lecturer)
=================================================================== */
.search-bar{margin:14px 18px;display:flex;gap:8px;}
.search-bar .input-wrap{flex:1;position:relative;}
.stud-row{
  margin:0 18px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);
}
.stud-avatar{width:38px;height:38px;border-radius:50%;background:var(--green-light);color:var(--green);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Poppins',sans-serif;}
.stud-row h4{font-size:.85rem;font-weight:700;}
.stud-row .meta{font-size:.72rem;color:var(--text-soft);}

/* ===================================================================
   DIGITAL STUDENT ID CARD
=================================================================== */
.idc-stage{
  display:flex;flex-direction:column;align-items:center;padding:28px 18px 4px;
  position:relative;overflow:hidden;
}
.idc-stage::before, .idc-stage::after{
  content:'';position:absolute;border-radius:50%;z-index:0;pointer-events:none;
}
.idc-stage::before{width:180px;height:180px;background:radial-gradient(circle,rgba(11,31,58,.10),transparent 70%);top:-60px;left:-50px;}
.idc-stage::after{width:220px;height:220px;background:radial-gradient(circle,rgba(224,147,44,.14),transparent 70%);bottom:-70px;right:-60px;}

.idc-card{
  width:100%;max-width:370px;background:#fbfaf7;border-radius:20px;overflow:hidden;
  box-shadow:0 22px 46px rgba(11,31,58,.22), 0 2px 6px rgba(11,31,58,.08);
  position:relative;z-index:1;border:1px solid rgba(11,31,58,.06);
}
.idc-card::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 22% 28%, rgba(13,44,84,.035) 1px, transparent 1px),
    radial-gradient(circle at 62% 72%, rgba(13,44,84,.035) 1px, transparent 1px);
  background-size:34px 34px;pointer-events:none;
}
.idc-band{
  background:linear-gradient(120deg,#0b1f3a 0%,#12305c 55%,#0b1f3a 100%);color:#fff;
  display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  position:relative;z-index:1;overflow:hidden;
}
.idc-band::after{
  content:'';position:absolute;top:-40%;right:-10%;width:120px;height:220%;
  background:rgba(224,147,44,.18);transform:rotate(18deg);pointer-events:none;
}
.idc-label{font-weight:800;letter-spacing:2.5px;font-size:11px;text-transform:uppercase;opacity:.85;}
.idc-univ-line{font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;margin-top:2px;}
.idc-year{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;background:rgba(224,147,44,.22);
  color:#f3cd84;padding:4px 12px;border-radius:var(--r-pill);border:1px solid rgba(224,147,44,.4);
}
.idc-body{display:grid;grid-template-columns:82px 1fr;gap:16px;padding:20px 18px 8px;position:relative;z-index:1;align-items:start;}
.idc-photo-col{display:flex;flex-direction:column;align-items:center;gap:8px;}
.idc-photo-box{
  width:82px;height:104px;border-radius:10px;background:#dfe3e8;display:flex;align-items:center;
  justify-content:center;overflow:hidden;position:relative;cursor:pointer;flex-shrink:0;
  border:3px solid #fff;box-shadow:0 0 0 2px var(--gold),0 6px 14px rgba(11,31,58,.18);
}
.idc-photo-box img{width:100%;height:100%;object-fit:cover;}
.idc-placeholder{font-size:9.5px;color:#6b7684;text-align:center;padding:6px;line-height:1.3;}
.idc-hint{
  position:absolute;bottom:0;left:0;right:0;background:rgba(13,44,84,.78);color:#fff;font-size:8.5px;
  text-align:center;padding:3px 0;opacity:0;transition:opacity .15s;
}
.idc-photo-box:hover .idc-hint{opacity:1;}
.idc-crest-mini{width:34px;height:34px;border-radius:8px;background:#fff;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;padding:3px;}
.idc-crest-mini img{width:100%;height:100%;object-fit:contain;}

.idc-info{display:flex;flex-direction:column;min-width:0;}
.idc-role{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:4px;}
.idc-name-line{font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;color:#0b1f3a;text-transform:uppercase;line-height:1.2;letter-spacing:.2px;word-break:break-word;}
.idc-num-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.idc-num{
  font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:#0b1f3a;letter-spacing:.5px;
  background:var(--green-light);padding:4px 10px;border-radius:var(--r-xs);
}
.idc-reg{font-size:10.5px;color:var(--text-soft);margin-top:8px;}
.idc-reg b{color:#0b1f3a;font-weight:700;}

.idc-uni-footer{display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 18px 10px;position:relative;z-index:1;}
.idc-uni-name{font-size:11px;font-weight:700;color:#0b1f3a;text-align:center;line-height:1.1;}
.idc-tagline{font-size:9px;font-style:italic;color:var(--danger);text-align:center;}

.idc-stripe{height:5px;background:repeating-linear-gradient(45deg,var(--gold) 0 9px,#0b1f3a 9px 11px,var(--danger) 11px 13px);margin:0 18px;border-radius:3px;}
/* ---- acoustic layer ---- */
.ac-panel{
  margin-top:16px;padding:14px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1.5px solid var(--border);text-align:left;
}
.ac-head{font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:8px;}
.ac-count{margin-left:auto;font-weight:600;color:var(--text-faint);font-size:.72rem;}
.ac-status{font-size:.76rem;color:var(--text-soft);line-height:1.5;margin-top:8px;}
.ac-dial{
  margin:12px auto 0;width:78px;height:78px;border-radius:50%;
  display:grid;place-items:center;font-size:30px;font-weight:800;
  font-variant-numeric:tabular-nums;color:var(--gold);
  border:3px solid var(--gold);animation:acpulse 1.15s ease-out infinite;
}
@keyframes acpulse{0%{transform:scale(.88);opacity:.6}70%{transform:scale(1.06);opacity:1}100%{transform:scale(.88);opacity:.6}}

#ac-student-bar{
  position:fixed;left:12px;right:12px;bottom:12px;z-index:900;
  background:var(--surface);border:1.5px solid var(--gold);
  border-radius:var(--r-sm);padding:12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  display:flex;align-items:center;gap:12px;
}
#ac-student-bar .txt{flex:1;font-size:.76rem;line-height:1.45;}
#ac-student-bar .num{
  font-size:22px;font-weight:800;color:var(--gold);
  font-variant-numeric:tabular-nums;min-width:30px;text-align:center;
}
#ac-student-bar button{
  background:none;border:0;color:var(--text-faint);font-size:.72rem;
  text-decoration:underline;cursor:pointer;padding:0;
}
.idc-footer-area{
  padding:12px 20px 14px;text-align:center;position:relative;z-index:1;
  background:#fff;margin:12px 14px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(11,31,58,.06);
}
.idc-site{font-size:10px;color:var(--text-faint);letter-spacing:.5px;}
.idc-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;position:relative;z-index:1;}

/* ===================================================================
   VENUE BOUNDARY DRAWING (Leaflet map)
=================================================================== */
.venue-map-wrap{margin:14px 18px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
#draw-venue-map{width:100%;height:320px;background:var(--surface-2);}
#walk-draw-map{width:100%;height:320px;background:var(--surface-2);}
.dv-badge.warn{background:var(--warn-light);color:var(--warn);}
.dv-badge.danger{background:var(--danger-light);color:var(--danger);}
.dv-controls{display:flex;gap:8px;margin:14px 18px 0;flex-wrap:wrap;}
.dv-controls .btn{width:auto;padding:0 14px;flex:1;min-width:90px;}
.dv-badge{
  display:inline-flex;align-items:center;gap:6px;margin:0 18px;padding:6px 12px;border-radius:var(--r-pill);
  background:var(--green-light);color:var(--green);font-size:.76rem;font-weight:700;
}

/* ===================================================================
   SKELETON
=================================================================== */
.skel{background:linear-gradient(90deg,var(--border) 25%,var(--surface-2) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.hidden{display:none!important;}
.spin{animation:spinRot 1s linear infinite;}
@keyframes spinRot{to{transform:rotate(360deg)}}

/* ===================================================================
   ATTENDANCE VERIFICATION
   A check-in is scored, not switched. These styles cover the live
   verification dial, the confidence meter on the result card, and the
   lecturer's review queue for borderline check-ins.
=================================================================== */
.verify-card{text-align:center;}
.vf-dial{width:148px;height:148px;margin:2px auto 6px;position:relative;}
.vf-dial svg{width:100%;height:100%;transform:rotate(-90deg);display:block;}
.vf-ring-bg{fill:none;stroke:var(--border);stroke-width:7;}
.vf-ring-fg{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:408;stroke-dashoffset:408;transition:stroke-dashoffset .55s cubic-bezier(.2,.8,.3,1);}
.vf-sweep{position:absolute;inset:16px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(224,147,44,0) 0deg,rgba(224,147,44,.26) 54deg,rgba(224,147,44,0) 56deg);
  animation:vfSweep 2.4s linear infinite;}
@keyframes vfSweep{to{transform:rotate(360deg)}}
.vf-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.vf-core .n{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.6rem;line-height:1;color:var(--text);}
.vf-core .u{font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);margin-top:5px;font-weight:700;}
.vf-checks{text-align:left;margin:16px 0 6px;display:flex;flex-direction:column;gap:3px;}
.vf-check{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-xs);
  font-size:.75rem;color:var(--text-faint);background:transparent;transition:background .25s ease,color .25s ease;}
.vf-check i{width:15px;text-align:center;font-size:.72rem;}
.vf-check .val{margin-left:auto;font-weight:700;font-size:.69rem;letter-spacing:.2px;}
.vf-check.run{color:var(--text-soft);background:var(--surface-2);}
.vf-check.run i{animation:vfPulse 1.1s ease-in-out infinite;}
@keyframes vfPulse{0%,100%{opacity:.35}50%{opacity:1}}
.vf-check.ok{color:var(--text);background:var(--success-light);}
.vf-check.ok i{color:var(--success);}
.vf-check.warn{color:var(--text);background:var(--warn-light);}
.vf-check.warn i{color:var(--warn);}
.vf-check.bad{color:var(--text);background:var(--danger-light);}
.vf-check.bad i{color:var(--danger);}

.conf-wrap{margin:4px 0 14px;text-align:left;}
.conf-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.conf-head .lbl{font-size:.63rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);font-weight:800;}
.conf-head .pct{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.05rem;}
.conf-track{height:8px;border-radius:var(--r-pill);background:var(--border);overflow:hidden;}
.conf-fill{height:100%;border-radius:var(--r-pill);width:0;transition:width .9s cubic-bezier(.2,.8,.3,1);}
.conf-fill.ok{background:linear-gradient(90deg,#199a5d,#42d491);}
.conf-fill.warn{background:linear-gradient(90deg,#a8790a,var(--gold));}
.conf-fill.bad{background:linear-gradient(90deg,#b8353a,var(--danger));}
.conf-scale{display:flex;justify-content:space-between;margin-top:7px;font-size:.6rem;color:var(--text-faint);letter-spacing:.3px;}

.factor-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 16px;text-align:left;}
.factor{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-xs);padding:9px 10px;}
.factor .k{font-size:.6rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text-faint);font-weight:800;}
.factor .v{font-size:.79rem;font-weight:700;margin-top:3px;color:var(--text);}
.factor.ok .v{color:var(--success);}
.factor.warn .v{color:var(--warn);}
.factor.bad .v{color:var(--danger);}

.flag-note{display:flex;gap:9px;align-items:flex-start;text-align:left;background:var(--danger-light);
  border-radius:var(--r-xs);padding:10px 12px;margin-bottom:14px;font-size:.74rem;line-height:1.45;color:var(--text);}
.flag-note i{color:var(--danger);margin-top:2px;}

.badge.review{background:var(--warn-light);color:var(--warn);}
.badge.rejected{background:var(--danger-light);color:var(--danger);}
.rv-banner{margin:16px 18px 8px;background:var(--warn-light);border:1.5px solid rgba(184,134,11,.28);
  border-radius:var(--r-sm);padding:12px 14px;display:flex;gap:11px;align-items:flex-start;}
.rv-banner i{color:var(--warn);margin-top:2px;}
.rv-banner h4{font-size:.82rem;font-weight:800;margin-bottom:3px;}
.rv-banner p{font-size:.72rem;color:var(--text-soft);line-height:1.5;}
.rv-why{margin-top:8px;background:var(--surface-2);border-radius:var(--r-xs);padding:8px 10px;
  font-size:.71rem;color:var(--text-soft);line-height:1.5;width:100%;}
.rv-why b{color:var(--text);font-weight:700;}
.rv-actions{display:flex;gap:8px;margin-top:10px;width:100%;}
.rv-actions .btn{margin-top:0;}
.conf-pill{display:inline-flex;align-items:center;gap:5px;font-size:.65rem;font-weight:800;
  padding:2px 8px;border-radius:var(--r-pill);letter-spacing:.3px;}
.conf-pill.ok{background:var(--success-light);color:var(--success);}
.conf-pill.warn{background:var(--warn-light);color:var(--warn);}
.conf-pill.bad{background:var(--danger-light);color:var(--danger);}

.qr-token-row{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;
  font-size:.68rem;color:var(--text-faint);font-weight:700;letter-spacing:.4px;}
.qr-token-row .dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:vfPulse 1.6s ease-in-out infinite;}

.info-panel{margin:0 18px 14px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r-md);padding:14px 15px;box-shadow:var(--shadow-sm);}
