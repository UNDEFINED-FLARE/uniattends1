<body>
<div id="root"></div>

<!-- React 18 is the last line with UMD builds, so it is pinned. htm gives
     template syntax without a JSX compile step. -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
/* =====================================================================
   LOCATION ENGINE — GPS polygon containment and the check-in score.
   Pure functions, shared unchanged with univen.html.
   ===================================================================== */
const DEFAULT_RADIUS_METERS = 50;

const GPS_GOOD_ENOUGH_ACCURACY = 20;     // metres — stop early once we get a fix this good;

const VERIFY_CFG = {
  windowMs: 9000,        // how long to keep sampling
  sampleEveryMs: 1200,
  targetSamples: 8,      // stop early once we have this many
  autoPass: 0.72,        // score at or above this marks present outright
  reviewFloor: 0.42,     // below this the check-in is refused
  tokenTtlMs: 90000,     // how long a scanned rotating code stays valid
  tokenRotateMs: 30000,  // how often the lecturer's QR regenerates
  maxSpeedMps: 12        // ~43 km/h between two readings = not a walking student
};

function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Flattens lat/lng to local metres around an origin point — accurate
// enough for building-sized areas, and lets us do plain 2D geometry
// (point-in-polygon, distance-to-edge) instead of spherical math.
function projectToMeters(lat, lng, originLat, originLng){
  const x = (lng - originLng) * Math.cos(originLat * Math.PI/180) * 111320;
  const y = (lat - originLat) * 110540;
  return { x, y };
}

function pointInPolygon(pt, poly){
  let inside = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
    const intersect = ((yi>pt.y) !== (yj>pt.y)) && (pt.x < (xj-xi)*(pt.y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

function distToSegmentMeters(p, a, b){
  const dx=b.x-a.x, dy=b.y-a.y;
  const lenSq = dx*dx+dy*dy;
  let t = lenSq===0 ? 0 : ((p.x-a.x)*dx + (p.y-a.y)*dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const projX = a.x + t*dx, projY = a.y + t*dy;
  return Math.hypot(p.x-projX, p.y-projY);
}

function distToPolygonEdgeMeters(pt, poly){
  let min = Infinity;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const d = distToSegmentMeters(pt, poly[j], poly[i]);
    if(d<min) min = d;
  }
  return min;
}

function polygonCentroid(points){
  let x=0, y=0;
  points.forEach(p=>{ x+=p.lat; y+=p.lng; });
  return { lat: x/points.length, lng: y/points.length };
}

function medianOf(arr){
  if(!arr.length) return 0;
  const a = [...arr].sort((x,y)=>x-y), m = a.length>>1;
  return a.length%2 ? a[m] : (a[m-1]+a[m])/2;
}

function logistic(x, midpoint, steepness){
  return 1/(1+Math.exp((x-midpoint)/Math.max(0.001, steepness)));
}

function getDeviceId(){
  let id = null;
  try{ id = localStorage.getItem('uvn_device_id'); }catch(e){}
  if(!id){
    id = 'd_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    try{ localStorage.setItem('uvn_device_id', id); }catch(e){}
  }
  return id;
}

function collectGpsSamples(onSample){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('This device cannot report its location')); return; }
    const samples = [];
    const startedAt = Date.now();
    let done = false, lastErr = null;
    const finish = ()=>{
      if(done) return;
      done = true;
      clearInterval(interval); clearTimeout(timer);
      if(samples.length) resolve(samples);
      else reject(lastErr || new Error('No location readings came through'));
    };
    const take = ()=>{
      navigator.geolocation.getCurrentPosition(
        pos=>{
          if(done) return;
          samples.push({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy || 999,
            altitude: pos.coords.altitude,
            t: Date.now()
          });
          if(onSample) onSample(samples, Date.now()-startedAt);
          if(samples.length >= VERIFY_CFG.targetSamples) finish();
        },
        err=>{ lastErr = new Error(err.message); if(samples.length===0 && err.code===1) finish(); },
        { enableHighAccuracy:true, maximumAge:0, timeout:5000 }
      );
    };
    take();
    const interval = setInterval(take, VERIFY_CFG.sampleEveryMs);
    const timer = setTimeout(finish, VERIFY_CFG.windowMs);
  });
}

function robustFix(samples){
  const lats = samples.map(s=>s.lat), lngs = samples.map(s=>s.lng);
  const mLat = medianOf(lats), mLng = medianOf(lngs);
  const dists = samples.map(s=>haversineMeters(s.lat, s.lng, mLat, mLng));
  const medDist = medianOf(dists);
  const mad = medianOf(dists.map(d=>Math.abs(d-medDist)));
  const cutoff = Math.max(15, medDist + 3*mad);
  let kept = samples.filter((s,i)=>dists[i] <= cutoff);
  if(!kept.length) kept = samples;

  let wsum=0, lat=0, lng=0;
  kept.forEach(s=>{
    const w = 1/Math.max(9, s.accuracy*s.accuracy);
    wsum += w; lat += s.lat*w; lng += s.lng*w;
  });
  lat /= wsum; lng /= wsum;

  const spread = kept.length>1 ? medianOf(kept.map(s=>haversineMeters(s.lat,s.lng,lat,lng))) : 0;
  const bestAcc = Math.min(...kept.map(s=>s.accuracy));
  const meanAcc = kept.reduce((a,s)=>a+s.accuracy,0)/kept.length;
  const accuracy = Math.max(3, Math.min(meanAcc, Math.max(spread, bestAcc/Math.sqrt(kept.length))));

  return { lat, lng, accuracy: Math.round(accuracy*10)/10, bestAccuracy: Math.round(bestAcc),
           spread: Math.round(spread*10)/10, used: kept.length, dropped: samples.length-kept.length,
           total: samples.length, timestamp: Date.now() };
}

function signedDistanceToPolygon(pt, polygonLatLng){
  const origin = polygonLatLng[0];
  const polyM = polygonLatLng.map(v=>projectToMeters(v.lat, v.lng, origin.lat, origin.lng));
  const p = projectToMeters(pt.lat, pt.lng, origin.lat, origin.lng);
  const d = distToPolygonEdgeMeters(p, polyM);
  return pointInPolygon(p, polyM) ? -d : d;
}

function containmentProbability(pt, session){
  let signed;
  if(session.venuePolygon && session.venuePolygon.length >= 3){
    signed = signedDistanceToPolygon(pt, session.venuePolygon);
  }else{
    const radius = session.radiusMeters || DEFAULT_RADIUS_METERS;
    signed = haversineMeters(pt.lat, pt.lng, session.lat, session.lng) - radius;
  }
  const sigma = Math.max(4, (pt.accuracy||20)*0.6);
  return { p: logistic(signed, 0, sigma), signedDistance: signed };
}

function sampleAgreement(samples, session){
  if(!samples.length) return 0;
  let inside = 0;
  samples.forEach(s=>{ if(containmentProbability(s, session).p >= 0.5) inside++; });
  return inside/samples.length;
}

function integrityFlags(samples, fix){
  const flags = [];
  // Apparent speed only counts once the jump is bigger than the two
  // readings' own error bars. Otherwise ordinary jitter on a weak
  // signal would look like teleporting every single time.
  let maxSpeed = 0;
  for(let i=1;i<samples.length;i++){
    const dt = (samples[i].t - samples[i-1].t)/1000;
    if(dt < 0.3) continue;
    const jump = haversineMeters(samples[i].lat, samples[i].lng, samples[i-1].lat, samples[i-1].lng);
    const explained = samples[i].accuracy + samples[i-1].accuracy;
    const v = Math.max(0, jump - explained)/dt;
    if(v > maxSpeed) maxSpeed = v;
  }
  if(maxSpeed > VERIFY_CFG.maxSpeedMps){
    flags.push({ code:'teleport', weight:0.5, label:`Position jumped ${Math.round(maxSpeed)} m/s further than the signal error explains` });
  }
  const uniquePts = new Set(samples.map(s=>s.lat.toFixed(6)+','+s.lng.toFixed(6)));
  if(samples.length >= 4 && uniquePts.size === 1){
    flags.push({ code:'frozen', weight:0.6, label:'Every reading was byte-identical — real GPS always wobbles, mock-location apps do not' });
  }
  const uniqueAcc = new Set(samples.map(s=>s.accuracy));
  if(samples.length >= 4 && uniqueAcc.size === 1 && samples[0].accuracy <= 5){
    flags.push({ code:'synthetic', weight:0.2, label:'Accuracy stayed pinned at one impossibly clean value' });
  }
  if(fix.spread > 60){
    flags.push({ code:'unstable', weight:0.15, label:'Readings scattered widely — signal here is poor' });
  }
  return { flags, maxSpeed: Math.round(maxSpeed*10)/10 };
}

/* Where is the rest of the room? Students already checked in form a cloud;
   anyone far outside it is the outlier worth a second look.

   The aggregate arrives from aa_peer_centroid() rather than being derived on
   the device. Row-level security means a student can read only their own
   register row, so computing this client-side saw zero peers and silently
   fell back to neutral - and a student has no business seeing a classmate's
   coordinates anyway. The server returns the centroid and spread, nothing
   individual. */
function roomConsensus(session, fix, myStudentNumber, agg){
  const peers = (agg && agg.peers) || 0;
  if(peers < 3) return { available:false, score:0.6, peers, distance:null };
  const distance = haversineMeters(fix.lat, fix.lng, agg.lat, agg.lng);
  const typical = Number(agg.spread) || 8;
  const tolerance = Math.max(20, typical*2 + fix.accuracy);
  return {
    available: true,
    score: logistic(distance, tolerance, Math.max(6, tolerance*0.35)),
    peers,
    distance: Math.round(distance)
  };
}

function presenceProof(session, scannedToken){
  const live = session.liveToken;
  if(scannedToken && live && scannedToken === live.value){
    const age = Date.now() - (live.at || 0);
    if(age <= VERIFY_CFG.tokenTtlMs) return { score:1, label:'Live code scanned', detail:'Scanned a rotating code straight off the lecturer\u2019s screen' };
    return { score:0.7, label:'Code slightly stale', detail:'The scanned code had already rotated' };
  }
  if(scannedToken) return { score:0.5, label:'Old code', detail:'This code has been replaced — it may have been forwarded' };
  return { score:0.62, label:'Session ID entered', detail:'Identified by session ID rather than a live scan' };
}

function scoreCheckIn(input){
  const { fix, samples, session, scannedToken, studentNumber } = input;
  const containment = containmentProbability(fix, session);
  const agreement   = sampleAgreement(samples, session);
  const precision   = logistic(fix.accuracy, 35, 11);
  const consensus   = roomConsensus(session, fix, studentNumber, input.peerAgg);
  const presence    = presenceProof(session, scannedToken);
  const integrity   = integrityFlags(samples, fix);

  const penalty = integrity.flags.reduce((a,f)=>a+f.weight, 0);
  const integrityScore = Math.max(0, 1 - penalty);

  // Integrity is a discount on the whole result, not one slice of it.
  // Location evidence that is itself suspect should not be able to
  // carry a check-in on the strength of a tidy-looking polygon match.
  const weights = { containment:.37, agreement:.21, precision:.13, consensus:.15, presence:.14 };
  const evidence =
      weights.containment * containment.p +
      weights.agreement   * agreement +
      weights.precision   * precision +
      weights.consensus   * consensus.score +
      weights.presence    * presence.score;
  let score = Math.max(0, Math.min(1, evidence * integrityScore));

  const hardFail = integrity.flags.some(f => f.code === 'frozen' || f.code === 'teleport');
  let tier;
  if(hardFail) tier = 'rejected';
  else if(score >= VERIFY_CFG.autoPass) tier = 'verified';
  else if(score >= VERIFY_CFG.reviewFloor) tier = 'review';
  else tier = 'rejected';

  const reasons = [];
  if(containment.p < 0.5) reasons.push(`the fix sits about ${Math.round(Math.abs(containment.signedDistance))}m outside the venue`);
  if(agreement < 0.5 && samples.length > 2) reasons.push(`only ${Math.round(agreement*100)}% of readings landed inside`);
  if(precision < 0.5) reasons.push(`accuracy was only \u00b1${Math.round(fix.accuracy)}m`);
  if(consensus.available && consensus.score < 0.5) reasons.push(`they were ${consensus.distance}m from where the rest of the class is sitting`);
  if(presence.score < 0.65) reasons.push(presence.detail.toLowerCase());
  integrity.flags.forEach(f=>reasons.push(f.label.toLowerCase()));

  return {
    score: Math.round(score*100)/100,
    tier,
    reasons,
    flags: integrity.flags.map(f=>({ code:f.code, label:f.label })),
    factors: {
      containment: Math.round(containment.p*100)/100,
      distance: Math.round(containment.signedDistance),
      agreement: Math.round(agreement*100)/100,
      precision: Math.round(precision*100)/100,
      accuracy: fix.accuracy,
      spread: fix.spread,
      samples: fix.total,
      dropped: fix.dropped,
      consensusScore: Math.round(consensus.score*100)/100,
      consensusPeers: consensus.peers,
      consensusDistance: consensus.distance,
      presence: presence.label,
      presenceScore: presence.score,
      integrity: Math.round(integrityScore*100)/100,
      maxSpeed: integrity.maxSpeed
    },
    engine: 2
  };
}
</script>

<script>
/* =====================================================================
   ACOUSTIC LAYER — inlined so this file stands alone.
   Capture and landmark hashing, the fusion policy (the room decides, the
   venue polygon is the fallback), and the wiring that drives them. One
   scope; two names were renamed where the originals collided.
   ===================================================================== */
(function(){
'use strict';

// js/fingerprint.js - ambient acoustic fingerprinting.
// No dependencies. Landmark (constellation) hashing, Wang-style.
//
// The important change from a naive version: capture is SYNCHRONISED.
// Two devices only match if they heard the same air at the same moment,
// so every device records the identical wall-clock interval. Opening the
// microphone early and slicing afterwards is what makes that possible.

const CFG = {
  RATE:      16000, // all analysis normalised to this
  WIN:       1024,  // FFT window (samples)
  HOP:       512,   // hop -> 31.25 frames/sec
  MIN_BIN:   19,    // ~300 Hz
  MAX_BIN:   384,   // ~6000 Hz
  NEIGH_T:   2,     // local-max neighbourhood, frames
  NEIGH_F:   4,     // local-max neighbourhood, bins
  PEAKS_SEC: 30,    // density cap
  FAN_OUT:   5,     // targets per anchor
  MIN_DT:    1,     // min frame gap
  MAX_DT:    63     // max frame gap (6 bits)
};

// ---------- 1. microphone ----------

const WORKLET_SRC = `
class Cap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Float32Array(2048); this.n = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.buf[this.n++] = ch[i];
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.slice());
        this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor('cap', Cap);
`;

/**
 * Open the microphone and start buffering immediately. Call this BEFORE the
 * moment you actually want to capture - a second or two of head start
 * absorbs permission prompts and audio-graph warm-up.
 *
 * @param {() => number} nowMs  clock used to stamp blocks (server-corrected)
 */
async function openMic(nowMs = Date.now, maxSeconds = 25) {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: false,  // these three REMOVE room sound.
      noiseSuppression: false,  // leaving them on will silently
      autoGainControl:  false,  // destroy your match rates.
      channelCount: 1
    }
  });

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') await ctx.resume();
  const src = ctx.createMediaStreamSource(stream);

  const mic = {
    ctx, stream, rate: ctx.sampleRate,
    blocks: [],     // Float32Array chunks, in order
    samples: 0,
    t0: null,       // wall-clock ms of blocks[0] sample 0
    node: null, sink: null
  };

  const take = (data) => {
    if (mic.t0 === null) {
      // this block was already captured when the callback fired
      mic.t0 = nowMs() - (data.length / mic.rate) * 1000;
    }
    mic.blocks.push(data);
    mic.samples += data.length;

    // The mic may stay open for a minute while we wait for the agreed
    // moment. Keep only a rolling tail, and move t0 with it.
    const cap = maxSeconds * mic.rate;
    while (mic.samples > cap && mic.blocks.length > 1) {
      const old = mic.blocks.shift();
      mic.samples -= old.length;
      mic.t0 += (old.length / mic.rate) * 1000;
    }
  };

  let usedWorklet = false;
  if (ctx.audioWorklet) {
    try {
      const url = URL.createObjectURL(
        new Blob([WORKLET_SRC], { type: 'application/javascript' }));
      await ctx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      const w = new AudioWorkletNode(ctx, 'cap');
      w.port.onmessage = e => take(e.data);
      src.connect(w);
      mic.node = w;
      usedWorklet = true;
    } catch (e) { /* fall through to the legacy path */ }
  }

  if (!usedWorklet) {
    // legacy path. route into a muted gain node, never the speakers.
    const sp = ctx.createScriptProcessor(4096, 1, 1);
    sp.onaudioprocess = e =>
      take(new Float32Array(e.inputBuffer.getChannelData(0)));
    const mute = ctx.createGain();
    mute.gain.value = 0;
    src.connect(sp); sp.connect(mute); mute.connect(ctx.destination);
    mic.node = sp; mic.sink = mute;
  }

  mic.close = async () => {
    try { if (mic.node) mic.node.disconnect(); } catch (e) {}
    try { if (mic.sink) mic.sink.disconnect(); } catch (e) {}
    try { src.disconnect(); } catch (e) {}
    stream.getTracks().forEach(t => t.stop());
    try { await ctx.close(); } catch (e) {}
  };

  return mic;
}

/** flatten everything buffered so far into one Float32Array */
function flatten(mic) {
  const out = new Float32Array(mic.samples);
  let o = 0;
  for (const b of mic.blocks) { out.set(b, o); o += b.length; }
  return out;
}

/**
 * Wait for `startWall`, keep buffering, then cut exactly the requested
 * interval out of what the microphone heard.
 * Returns { samples, lateBy } - lateBy > 0 means the mic opened after the
 * interval had already begun and the clip is short.
 */
async function captureAt(mic, startWall, seconds, nowMs = Date.now, onTick) {
  const endWall = startWall + seconds * 1000;
  const tick = onTick
    ? setInterval(() => onTick((startWall - nowMs()) / 1000), 100)
    : null;

  // +250 ms of slack so the tail is definitely in the buffer
  while (nowMs() < endWall + 250) {
    await new Promise(r => setTimeout(r, 40));
  }
  if (tick) clearInterval(tick);

  if (mic.t0 === null) throw new Error('microphone produced no audio');

  const all = flatten(mic);
  const want = Math.round(seconds * mic.rate);
  let start = Math.round(((startWall - mic.t0) / 1000) * mic.rate);
  const lateBy = start < 0 ? -start / mic.rate : 0;
  if (start < 0) start = 0;
  if (start > all.length - 1) start = Math.max(0, all.length - want);

  const clip = all.subarray(start, Math.min(all.length, start + want));
  return { samples: resample(clip, mic.rate, CFG.RATE), lateBy };
}

function resample(input, inRate, outRate) {
  if (inRate === outRate) return Float32Array.from(input);
  const ratio  = inRate / outRate;
  const outLen = Math.floor(input.length / ratio);
  const out    = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const pos  = i * ratio;
    const i0   = Math.floor(pos);
    const frac = pos - i0;
    const a = input[i0] || 0;
    const b = input[i0 + 1] || 0;
    out[i] = a + (b - a) * frac;
  }
  return out;
}

// ---------- 2. FFT ----------

function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    const half = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < half; k++) {
        const pr = re[i + k], pi = im[i + k];
        const qr = re[i + k + half] * cr - im[i + k + half] * ci;
        const qi = re[i + k + half] * ci + im[i + k + half] * cr;
        re[i + k] = pr + qr;          im[i + k] = pi + qi;
        re[i + k + half] = pr - qr;   im[i + k + half] = pi - qi;
        const ncr = cr * wr - ci * wi;
        ci = cr * wi + ci * wr;
        cr = ncr;
      }
    }
  }
}

// ---------- 3. spectrogram ----------

function spectrogram(samples) {
  const { WIN, HOP } = CFG;
  const hann = new Float32Array(WIN);
  for (let i = 0; i < WIN; i++)
    hann[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (WIN - 1));

  const frames = [];
  for (let s = 0; s + WIN <= samples.length; s += HOP) {
    const re = new Float64Array(WIN);
    const im = new Float64Array(WIN);
    for (let i = 0; i < WIN; i++) re[i] = samples[s + i] * hann[i];
    fft(re, im);
    const mag = new Float32Array(WIN / 2);
    for (let b = 0; b < WIN / 2; b++)
      mag[b] = 20 * Math.log10(Math.hypot(re[b], im[b]) + 1e-12);
    frames.push(mag);
  }
  return frames;
}

// ---------- 4. peak picking ----------

function peaks(frames) {
  const { MIN_BIN, MAX_BIN, NEIGH_T, NEIGH_F, PEAKS_SEC, HOP, RATE } = CFG;
  const found = [];

  for (let t = 0; t < frames.length; t++) {
    // per-frame floor: median of the analysis band
    const band = Array.from(frames[t].slice(MIN_BIN, MAX_BIN)).sort((a, b) => a - b);
    const floor = band[band.length >> 1] + 6;

    for (let f = MIN_BIN; f < MAX_BIN; f++) {
      const v = frames[t][f];
      if (v < floor) continue;
      let isMax = true;
      for (let dt = -NEIGH_T; dt <= NEIGH_T && isMax; dt++) {
        const tt = t + dt;
        if (tt < 0 || tt >= frames.length) continue;
        for (let df = -NEIGH_F; df <= NEIGH_F; df++) {
          if (dt === 0 && df === 0) continue;
          const ff = f + df;
          if (ff < MIN_BIN || ff >= MAX_BIN) continue;
          if (frames[tt][ff] > v) { isMax = false; break; }
        }
      }
      if (isMax) found.push({ t, f, v });
    }
  }

  const seconds = (frames.length * HOP) / RATE;
  const cap = Math.max(20, Math.round(PEAKS_SEC * seconds));
  found.sort((a, b) => b.v - a.v);
  const kept = found.slice(0, cap);
  kept.sort((a, b) => a.t - b.t || a.f - b.f);
  return kept;
}

// ---------- 5. hashing ----------

function hashes(pk) {
  const { FAN_OUT, MIN_DT, MAX_DT } = CFG;
  const out = [];
  for (let i = 0; i < pk.length; i++) {
    let made = 0;
    for (let j = i + 1; j < pk.length && made < FAN_OUT; j++) {
      const dt = pk[j].t - pk[i].t;
      if (dt < MIN_DT) continue;
      if (dt > MAX_DT) break;
      const f1 = pk[i].f & 0x3FF;
      const f2 = pk[j].f & 0x3FF;
      const h  = (f1 << 16) | (f2 << 6) | (dt & 0x3F);
      out.push({ h, o: pk[i].t });
      made++;
    }
  }
  return out;
}


// ---------- 6. is this window worth believing? ----------
//
// The deployed matcher reads entropy.score and treats anything below 0.35 as
// too weak to be decisive in either direction. A near-silent or perfectly
// stationary room produces landmarks that are mostly microphone self-noise:
// they will either match nothing, or match everything.
//
// Three things have to be true for a window to carry information - there has
// to be sound, it has to change over time, and it has to have structure across
// the spectrum. A steady air-conditioner passes the first and fails the others.

const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const r3 = x => Math.round(x * 1000) / 1000;

function entropyReport(frames, samples) {
  const { MIN_BIN, MAX_BIN } = CFG;
  const width = MAX_BIN - MIN_BIN;

  // 1. level, in dBFS
  let sq = 0;
  for (let i = 0; i < samples.length; i++) sq += samples[i] * samples[i];
  const dbfs = 20 * Math.log10(Math.sqrt(sq / Math.max(1, samples.length)) + 1e-12);
  const level = clamp01((dbfs + 60) / 35);           // -60 dBFS -> 0, -25 -> 1

  // 2. flux: how much the spectrum moves frame to frame
  let flux = 0;
  for (let t = 1; t < frames.length; t++) {
    let d = 0;
    for (let b = MIN_BIN; b < MAX_BIN; b++)
      d += Math.abs(frames[t][b] - frames[t - 1][b]);
    flux += d / width;
  }
  flux = frames.length > 1 ? flux / (frames.length - 1) : 0;
  const change = clamp01(flux / 6);                   // 6 dB mean step -> 1

  // 3. spread: structure across the analysis band
  let sum = 0, n = 0;
  for (const fr of frames)
    for (let b = MIN_BIN; b < MAX_BIN; b++) { sum += fr[b]; n++; }
  const mean = sum / Math.max(1, n);
  let varr = 0;
  for (const fr of frames)
    for (let b = MIN_BIN; b < MAX_BIN; b++) varr += (fr[b] - mean) ** 2;
  const spread = Math.sqrt(varr / Math.max(1, n));
  const structure = clamp01((spread - 2) / 10);       // 12 dB spread -> 1

  // Level GATES the other two rather than averaging with them. Microphone
  // self-noise in a silent room fluctuates just as much as a lecture does, so
  // a weighted mean of level and flux scores near-silence as informative -
  // which is exactly backwards. No sound, no evidence, however lively the
  // noise floor looks.
  return {
    score: r3(clamp01(level * (0.45 + 0.30 * change + 0.25 * structure))),
    level: r3(level), change: r3(change), structure: r3(structure),
    dbfs: r3(dbfs), spread: r3(spread)
  };
}

// ---------- 7. one call, in the shape aa_submissions wants ----------

/**
 * Samples in, submission out. `hashes` and `offsets` are parallel int arrays,
 * which is exactly how the matcher indexes them.
 */
function analyse(samples) {
  const frames = spectrogram(samples);
  const pk = peaks(frames);
  const pairs = hashes(pk);
  return {
    hashes:  pairs.map(p => p.h),
    offsets: pairs.map(p => p.o),
    entropy: entropyReport(frames, samples),
    peakCount: pk.length,
    frameCount: frames.length
  };
}

// js/fuse.js - the room decides; the polygon is the fallback.
//
//   Acoustic (primary)   every device captures the same seconds, the server
//                        matches landmark sets and clusters the ones that
//                        heard the same air, anchored to the lecturer's phone.
//                        Answers: "is this phone in this ROOM, now?"
//
//   Location (backup)    GPS polygon containment, sample agreement, fix
//                        precision, peer consensus, a rotating QR token, and
//                        mock-location heuristics.
//                        Answers: "is this phone at this venue?"
//
// Acoustic leads because it answers the question attendance actually asks. GPS
// is weakest exactly where lectures happen - indoors, under concrete, drifting
// tens of metres, unable to tell Hall A from Hall B next door - and it is the
// layer a mock-location app defeats outright. None of that touches whether a
// phone heard the room.
//
// So the polygon is not a second opinion on a question the audio already
// answered. It is what answers the question when the audio cannot: in the
// first minutes before a cluster exists, in a silent room, when too few
// devices captured, or when a student refused the microphone.
//
// The two paths are mutually exclusive, which is also why this no longer has
// to unpick double counting. When acoustic decides, GPS peer consensus is not
// added to it - the room already corroborated the room. When acoustic cannot
// decide, the location verdict stands exactly as its own engine computed it.

const FUSE_CFG = {
  autoPass:    0.72,   // the tiers the location engine already uses
  reviewFloor: 0.42,

  // An acoustic verdict on its own spans this range, so a strong cluster
  // clears autoPass without help and a thin one does not.
  acousticFloor: 0.45,
  acousticSpan:  0.50,

  // GPS only nudges a verdict the room already made. Small on purpose: an
  // indoor fix is the least trustworthy thing in the stack.
  confirmBonus: 0.08,
  conflictDrop: 0.06,

  minCorroborating: 2, // devices that must agree before absence means anything
  lowEntropy:       0.35
};

const fuseClamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const r2 = x => Math.round(x * 100) / 100;

/**
 * How much a student's acoustic result is worth, in [0,1].
 *
 * `acoustic` is one student folded across the windows of a class:
 *   { available, clusterMember, confidenceBand, corroboratingDevices,
 *     clusterSize, windowsPresent, windowsAnalysed, lecturerBound,
 *     entropyScore }
 */
function acousticStrength(acoustic) {
  if (!acoustic || !acoustic.available) return { score: 0, decisive: false };

  const band = { high: 1, medium: 0.72, low: 0.35, none: 0 }[acoustic.confidenceBand] ?? 0;

  // Being in one window of four is not being in four of four.
  const total = acoustic.windowsAnalysed || 0;
  const share = total > 0 ? (acoustic.windowsPresent || 0) / total : 0;

  let score = band * (0.45 + 0.55 * share);

  // A cluster without the lecturer's phone is a room, but not provably this
  // class's room.
  if (acoustic.lecturerBound === false) score *= 0.5;

  // A quiet window cannot support a strong conclusion in either direction.
  const quiet = (acoustic.entropyScore ?? 1) < FUSE_CFG.lowEntropy;
  if (quiet) score *= 0.6;

  // Absence only counts as evidence when there was a room to be absent from.
  const decisive = total > 0 && !quiet &&
    acoustic.lecturerBound !== false &&
    (acoustic.clusterMember
      ? true
      : (acoustic.clusterSize || 0) >= FUSE_CFG.minCorroborating + 1);

  return { score: fuseClamp01(score), decisive, share, quiet, band };
}

/**
 * @param {object} checkIn  the record's `verification` from the location
 *                          engine: { score, tier, factors, flags, reasons }
 * @param {object} acoustic folded acoustic evidence, or { available:false }
 */
function fuse(checkIn, acoustic) {
  const gpsScore = typeof checkIn?.score === 'number' ? checkIn.score : 0;
  const gpsTier  = checkIn?.tier || 'review';
  const gpsPositive = gpsTier === 'verified';
  const hardFail = (checkIn?.flags || [])
    .some(f => f.code === 'frozen' || f.code === 'teleport');

  const a = acousticStrength(acoustic);
  const reasons = [];
  let score, tier, agreement;

  // ---------------------------------------------------------- primary: room
  if (acoustic && acoustic.available && acoustic.clusterMember) {
    score = FUSE_CFG.acousticFloor + FUSE_CFG.acousticSpan * a.score;
    reasons.push(`heard this room in ${acoustic.windowsPresent} of ` +
      `${acoustic.windowsAnalysed} windows, alongside ` +
      `${acoustic.corroboratingDevices} other devices`);

    if (gpsPositive) {
      agreement = 'corroborated';
      score += FUSE_CFG.confirmBonus;
      reasons.push('the location fix agrees');
    } else if (gpsTier === 'rejected') {
      // Being heard in the room outranks a fix that could not place you. This
      // is the ordinary indoor case, not a suspicious one.
      agreement = 'acoustic-over-location';
      score -= FUSE_CFG.conflictDrop;
      reasons.push('the location fix could not place this phone, which is ' +
                   'expected indoors and does not outweigh the room');
    } else {
      agreement = 'acoustic-primary';
    }

  // ------------------------------------------- primary: the room says no
  } else if (acoustic && acoustic.available && a.decisive) {
    agreement = gpsPositive ? 'contradicted' : 'both-weak';
    score = Math.min(gpsScore, FUSE_CFG.reviewFloor - 0.02);
    reasons.push(gpsPositive
      ? `no device in the room heard what this phone heard, across ` +
        `${acoustic.windowsAnalysed} windows, though the location fix looked right`
      : 'neither the room nor the location fix placed this phone here');

  // --------------------------------------------------------- backup: polygon
  } else {
    agreement = 'location-fallback';
    score = gpsScore;
    tier = gpsTier;                       // stands exactly as its engine set it
    reasons.push(...(checkIn?.reasons || []));
    reasons.push(!acoustic || !acoustic.available
      ? 'no listening window was matched, so the venue polygon decided this'
      : a.quiet
        ? 'the room was too quiet to be decisive, so the venue polygon decided this'
        : 'too few devices captured for the room to be decisive, so the venue ' +
          'polygon decided this');
  }

  if (tier === undefined) tier = tierFor(score);

  // ------------------------------------------------------------- guard rails
  //
  // Nothing here turns silence into an absence. A student whose phone is flat,
  // or muted, or who refused the microphone, must not be marked absent by a
  // check they could not take part in.
  if (agreement === 'contradicted' && tier === 'rejected') tier = 'review';
  if (acoustic && acoustic.clusterMember && tier === 'rejected') tier = 'review';

  // A device caught faking its location is not waved through for having been
  // in the room. Present and running a mock-location app is a discipline
  // question, and a human should see it.
  if (hardFail) {
    tier = 'review';
    reasons.push('location readings showed signs of tampering - present, but worth a look');
  }

  return {
    score: r2(fuseClamp01(score)),
    tier,
    status: tier === 'verified' ? 'present'
          : tier === 'review'   ? 'pending-review'
          : 'rejected',
    agreement,
    primary: agreement === 'location-fallback' ? 'location' : 'acoustic',
    acoustic: { strength: r2(a.score), decisive: a.decisive },
    reasons,
    engine: 4
  };
}

function tierFor(score) {
  const s = fuseClamp01(score);
  if (s >= FUSE_CFG.autoPass) return 'verified';
  if (s >= FUSE_CFG.reviewFloor) return 'review';
  return 'rejected';
}

// js/uvn-acoustic.js — the acoustic layer, wired into the UNIVEN app.
//
// The location check-in happens once, at the door. Acoustic evidence arrives
// during the lecture, so it cannot be a seventh term in scoreCheckIn - it is a
// second stage that revises the record afterwards.
//
//   1. the lecturer opens a listening window; every device in the room,
//      theirs included, records the same few seconds
//   2. the server matches landmark sets and clusters the devices that heard
//      the same air, then deletes the landmarks
//   3. fuse() combines each student's location verdict with their acoustic
//      one, and the register is rewritten with what the two agreed on
//
// A module, loaded after the app's classic script, so it borrows the client
// the compat layer already authenticated rather than opening a second session.


const AC_CFG = {
  LEAD_MS: 8000,        // warning before the capture instant
  MIN_LEAD_MS: 2500,    // below this, wait for the next window
  CAPTURE_SECONDS: 5,
  MIC_BUFFER_SECONDS: 40,
  POLL_MS: 1500
};

const sb = () => window.sb;
const ok = r => { if (r.error) throw new Error(r.error.message); return r.data; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Device clocks are not trusted: the capture instant is derived from the
   window's server-side opens_at, and each device corrects its own offset. */
let skew = 0;
const now = () => Date.now() + skew;

async function syncClock() {
  let best = Infinity;
  for (let i = 0; i < 3; i++) {
    const t0 = Date.now();
    try {
      const res = await fetch(window.SUPABASE_REST || (sb().supabaseUrl + '/rest/v1/'), {
        method: 'HEAD', headers: { apikey: sb().supabaseKey }
      });
      const rtt = Date.now() - t0;
      const h = res.headers.get('date');
      if (!h) break;
      if (rtt < best) { best = rtt; skew = new Date(h).getTime() + rtt / 2 - Date.now(); }
    } catch (e) { break; }
  }
  return skew;
}

/** Capture the agreed interval and hand the landmarks over. */
async function captureAndSubmit(mic, win, userId, onTick) {
  const secs = win.seconds || AC_CFG.CAPTURE_SECONDS;
  const captureAtMs = new Date(win.opens_at).getTime() + AC_CFG.LEAD_MS;

  const cut = await captureAt(mic, captureAtMs, secs, now, onTick);
  const fp = analyse(cut.samples);
  if (!fp.hashes.length) throw new Error('nothing usable was recorded');

  const res = await sb().from('aa_submissions').insert({
    window_id: win.id,
    user_id: userId,
    device_id: localStorage.getItem('uvn_device_id') || null,
    hash_count: fp.hashes.length,
    entropy: fp.entropy,
    hashes: fp.hashes,
    offsets: fp.offsets
  });
  // a second submission for the same window is a no-op, not an error
  if (res.error && res.error.code !== '23505') throw new Error(res.error.message);
  return fp;
}

/** The window a device should be aiming at, with enough lead time left. */
async function pendingWindow(sessionId) {
  const rows = ok(await sb().from('aa_windows')
    .select('id, idx, seconds, opens_at, closes_at, analysed_at')
    .eq('class_session_id', sessionId)
    .is('analysed_at', null)
    .order('idx', { ascending: false })
    .limit(3));
  for (const w of rows || []) {
    const at = new Date(w.opens_at).getTime() + AC_CFG.LEAD_MS;
    if (at - now() < AC_CFG.MIN_LEAD_MS) continue;
    if (now() > new Date(w.closes_at).getTime()) continue;
    return w;
  }
  return null;
}

// =====================================================================
// lecturer
// =====================================================================

let lecMic = null;

/** Open a window and anchor it with the lecturer's own device. */
async function openListeningWindow(sessionId, onState) {
  await syncClock();
  const say = s => onState && onState(s);

  if (!lecMic) {
    say({ phase: 'mic', text: 'Asking for the microphone…' });
    lecMic = await openMic(now, AC_CFG.MIC_BUFFER_SECONDS);
  }

  const win = ok(await sb().rpc('aa_open_window',
    { p_session: sessionId, p_seconds: AC_CFG.CAPTURE_SECONDS }));
  say({ phase: 'opened', window: win, text: 'Window ' + (win.idx + 1) + ' open' });

  const { data: { user } } = await sb().auth.getUser();
  const fp = await captureAndSubmit(lecMic, win, user.id, left => {
    say(left > 0
      ? { phase: 'countdown', seconds: Math.ceil(left),
          text: 'Everyone records in ' + Math.ceil(left) }
      : { phase: 'listening', text: 'Listening…' });
  });

  say({
    phase: 'anchored', window: win, entropy: fp.entropy.score,
    text: fp.entropy.score < 0.35
      ? 'Anchored, but the room is very quiet (' + fp.entropy.score.toFixed(2) +
        ') — this window may not be decisive.'
      : 'Anchored with ' + fp.hashes.length + ' landmarks. Students can keep capturing.'
  });
  return win;
}

function releaseLecturerMic() {
  if (lecMic) { lecMic.close(); lecMic = null; }
}

/** Match a window, then fold both layers into the register. */
async function matchWindow(sessionId, windowId, onState) {
  const say = s => onState && onState(s);
  say({ phase: 'matching', text: 'Matching…' });

  const { data, error } = await sb().functions.invoke('analyse-window', { body: { windowId } });
  if (error) {
    let detail = error.message;
    try { detail = (await error.context.json()).error || detail; } catch (e) {}
    throw new Error(detail);
  }
  if (data && data.error) throw new Error(data.error);

  const fused = await fuseSession(sessionId);
  say({
    phase: 'matched', result: data, fused,
    text: 'Matched ' + data.submissions + ' devices, cluster of ' + data.clusterSize +
          (data.lecturerBound ? ', anchored to your phone' : ' — WITHOUT your phone') +
          '. ' + fused.changed + ' of ' + fused.total + ' register rows revised.'
  });
  return data;
}

/**
 * Combine the two layers for every student in the session.
 *
 * The location verdict is whatever scoreCheckIn stored at the door; the
 * acoustic verdict is folded across every analysed window. fuse() decides what
 * they add up to, and refuses to turn either one into an absence on its own.
 */
async function fuseSession(sessionId) {
  const windows = ok(await sb().from('aa_windows')
    .select('id, cluster_size, lecturer_bound, analysed_at')
    .eq('class_session_id', sessionId).not('analysed_at', 'is', null));
  const ids = windows.map(w => w.id);

  const register = ok(await sb().from('aa_attendance')
    .select('student_id, verification, windows_present, windows_analysed, overridden_by')
    .eq('class_session_id', sessionId));

  if (!ids.length) return { total: register.length, changed: 0 };

  const evidence = ok(await sb().from('aa_evidence')
    .select('user_id, window_id, cluster_member, confidence_band, corroborating_devices, entropy_score')
    .in('window_id', ids));

  const byWindow = {};
  windows.forEach(w => { byWindow[w.id] = w; });

  const byUser = new Map();
  for (const e of evidence) {
    if (!byUser.has(e.user_id)) byUser.set(e.user_id, []);
    byUser.get(e.user_id).push(e);
  }

  const RANK = { none: 0, low: 1, medium: 2, high: 3 };
  let changed = 0;

  for (const row of register) {
    if (row.overridden_by) continue;          // a human already ruled on this
    const mine = byUser.get(row.student_id) || [];

    let acoustic;
    if (!mine.length) {
      acoustic = { available: false };
    } else {
      // best band across windows, worst-case entropy, and whether any cluster
      // this student sat in was actually anchored to the lecturer
      let band = 'none', peers = 0, entropy = 1, member = false, clusterSize = 0;
      let bound = false;
      for (const e of mine) {
        if (RANK[e.confidence_band] > RANK[band]) band = e.confidence_band;
        peers = Math.max(peers, e.corroborating_devices || 0);
        entropy = Math.min(entropy, e.entropy_score == null ? 1 : e.entropy_score);
        if (e.cluster_member) member = true;
        const w = byWindow[e.window_id] || {};
        clusterSize = Math.max(clusterSize, w.cluster_size || 0);
        if (w.lecturer_bound) bound = true;
      }
      acoustic = {
        available: true,
        clusterMember: member,
        confidenceBand: band,
        corroboratingDevices: peers,
        clusterSize: clusterSize,
        windowsPresent: row.windows_present || mine.filter(e => e.cluster_member).length,
        windowsAnalysed: row.windows_analysed || ids.length,
        lecturerBound: bound,
        entropyScore: entropy
      };
    }

    const verdict = fuse(row.verification, acoustic);
    const res = await sb().rpc('aa_set_fused', {
      p_session: sessionId, p_student: row.student_id, p_fused: verdict
    });
    if (!res.error && res.data) changed++;
  }

  return { total: register.length, changed };
}

// =====================================================================
// student
// =====================================================================

let stuMic = null, watching = false, seen = new Set();

/**
 * Called once, from a tap, after the student has checked in. The microphone
 * stays open for the class - only a rolling tail is held, in memory - and each
 * window the lecturer opens is captured automatically.
 */
async function startListening(sessionId, onState) {
  const say = s => onState && onState(s);
  await syncClock();

  if (!stuMic) {
    say({ phase: 'mic', text: 'Asking for the microphone…' });
    stuMic = await openMic(now, AC_CFG.MIC_BUFFER_SECONDS);
  }
  const { data: { user } } = await sb().auth.getUser();

  watching = true;
  say({ phase: 'waiting', text: 'Listening for your lecturer to open a window' });

  (async function loop() {
    while (watching) {
      let win = null;
      try { win = await pendingWindow(sessionId); }
      catch (e) { await sleep(4000); continue; }

      if (!win || seen.has(win.id)) { await sleep(AC_CFG.POLL_MS); continue; }

      try {
        const fp = await captureAndSubmit(stuMic, win, user.id, left => {
          if (!watching) return;
          say(left > 0
            ? { phase: 'countdown', seconds: Math.ceil(left),
                text: 'Window ' + (win.idx + 1) + ' — recording in ' + Math.ceil(left) }
            : { phase: 'listening', text: 'Listening…' });
        });
        seen.add(win.id);
        say({ phase: 'submitted', window: win.idx + 1, hashes: fp.hashes.length,
              text: 'Window ' + (win.idx + 1) + ' sent. Waiting for the next one.' });
      } catch (e) {
        seen.add(win.id);
        say({ phase: 'error', text: e.message });
        await sleep(2000);
      }
    }
  })();
}

function stopListening() {
  watching = false;
  if (stuMic) { stuMic.close(); stuMic = null; }
  seen = new Set();
}

const acousticConfig = AC_CFG;

// The app is a classic script, so hand it plain globals.
window.uvnAcoustic = {
  openListeningWindow, matchWindow, fuseSession, releaseLecturerMic,
  startListening, stopListening, config: AC_CFG
};
window.dispatchEvent(new Event('uvn-acoustic-ready'));
})();
</script>

const EMAIL_DOMAIN = 'mvula.univen.ac.za';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});
window.sb = sb;   // the acoustic bundle borrows this client

const unwrap = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------------------------------------------------------------- data layer

const api = {
  emailFor(idOrEmail) {
    const v = idOrEmail.trim();
    return v.includes('@') ? v : v + '@' + EMAIL_DOMAIN;
  },

  signIn: (idOrEmail, password) =>
    sb.auth.signInWithPassword({ email: api.emailFor(idOrEmail), password })
      .then(unwrap),

  signUp: ({ studentNumber, name, email, password }) =>
    sb.auth.signUp({
      email, password,
      options: { data: {
        aa_display_name: name, aa_role: 'student', aa_student_number: studentNumber
      } }
    }).then(unwrap),

  signOut: () => sb.auth.signOut(),

  profile: uid => sb.from('aa_profiles')
    .select('id, role, display_name, student_number, email, photo_data, created_at')
    .eq('id', uid).maybeSingle().then(unwrap),

  createProfile: row => sb.from('aa_profiles').insert(row).select().single().then(unwrap),

  enrolments: () => sb.from('aa_enrolments')
    .select('course_id, aa_courses ( code, title )').then(unwrap),

  openSessions: () => sb.from('aa_class_sessions')
    .select(`id, title, venue, join_code, status, started_at, expires_at,
             lat, lng, radius_meters, venue_polygon, live_token,
             reflection_min_words, meta, aa_courses ( code, title )`)
    .eq('status', 'open')
    .order('started_at', { ascending: false }).then(unwrap),

  session: id => sb.from('aa_class_sessions')
    .select(`id, title, venue, join_code, status, started_at, expires_at,
             lat, lng, radius_meters, venue_polygon, live_token,
             reflection_min_words, meta, aa_courses ( code, title )`)
    .eq('id', id).maybeSingle().then(unwrap),

  peerCentroid: sessionId =>
    sb.rpc('aa_peer_centroid', { p_session: sessionId }).then(unwrap),

  checkIn: (sessionId, { status, gps, verification, deviceId, reflection, words }) =>
    sb.rpc('aa_check_in', {
      p_session: sessionId, p_status: status, p_gps: gps,
      p_verification: verification, p_device: deviceId,
      p_reflection: reflection || null, p_words: words || null
    }).then(unwrap),

  myAttendance: () => sb.from('aa_attendance')
    .select(`status, source, confidence, windows_present, windows_analysed,
             checked_in_at, fused, verification,
             aa_class_sessions ( title, venue, started_at ),
             aa_courses ( code, title )`)
    .order('updated_at', { ascending: false }).limit(40).then(unwrap)
};

/** A session row, shaped the way the scoring engine expects it. */
const toEngineSession = s => ({
  lat: s.lat, lng: s.lng,
  radiusMeters: s.radius_meters || DEFAULT_RADIUS_METERS,
  venuePolygon: s.venue_polygon,
  venueName: (s.meta && s.meta.venueName) || s.venue,
  moduleCode: (s.meta && s.meta.moduleCode) || (s.aa_courses && s.aa_courses.code) || '',
  liveToken: s.live_token,
  expiresAt: s.expires_at ? new Date(s.expires_at).getTime() : null,
  reflectionMinWords: s.reflection_min_words
});

// ---------------------------------------------------------------- auth context

const Auth = createContext(null);
const useAuth = () => useContext(Auth);

function AuthProvider({ children }) {
  const [state, setState] = useState({ loading: true, user: null, profile: null });

  const load = useCallback(async session => {
    if (!session) { setState({ loading: false, user: null, profile: null }); return; }
    let profile = null;
    try { profile = await api.profile(session.user.id); } catch (e) {}
    setState({ loading: false, user: session.user, profile });
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(r => load(r.data.session));
    const { data } = sb.auth.onAuthStateChange((_e, s) => load(s));
    return () => data.subscription.unsubscribe();
  }, [load]);

  const value = useMemo(() => ({
    ...state,
    refresh: async () => {
      const r = await sb.auth.getSession();
      await load(r.data.session);
    },
    signOut: async () => { await api.signOut(); }
  }), [state, load]);

  return html`<${Auth.Provider} value=${value}>${children}<//>`;
}

function StudentAuth({ onBack }) {
  const { refresh } = useAuth();
  const [tab, setTab] = useState('login');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [f, setF] = useState({ id: '', pwd: '', number: '', name: '', email: '', p1: '', p2: '' });
  const set = k => e => setF(s => ({ ...s, [k]: e.target.value }));

  async function login() {
    if (!f.id || !f.pwd) return setMsg({ kind: 'error', text: 'Enter your details.' });
    setBusy(true); setMsg(null);
    try { await api.signIn(f.id, f.pwd); await refresh(); }
    catch (e) { setMsg({ kind: 'error', text: friendly(e) }); }
    finally { setBusy(false); }
  }

  async function register() {
    if (!f.number || !f.name || !f.email)
      return setMsg({ kind: 'error', text: 'Please fill in all fields.' });
    if (f.p1.length < 8)
      return setMsg({ kind: 'error', text: 'Your password needs at least 8 characters.' });
    if (f.p1 !== f.p2)
      return setMsg({ kind: 'error', text: 'The two passwords do not match.' });
    setBusy(true); setMsg(null);
    try {
      const r = await api.signUp({ studentNumber: f.number, name: f.name,
                                   email: f.email, password: f.p1 });
      if (!r.session) setMsg({ kind: 'info', text: 'Account created. Confirm the link in your email, then log in.' });
      else await refresh();
    } catch (e) { setMsg({ kind: 'error', text: friendly(e) }); }
    finally { setBusy(false); }
  }

  return html`
    <div class="screen active auth-screen">
      <div class="topbar">
        <button class="icon-btn" onClick=${onBack}><${Icon} name="fa-arrow-left" /></button>
        <h3>Student Account</h3>
      </div>
      <div class="form-card">
        <div class="tab-switch">
          <button class=${tab === 'login' ? 'active' : ''} onClick=${() => setTab('login')}>Log In</button>
          <button class=${tab === 'register' ? 'active' : ''} onClick=${() => setTab('register')}>Register</button>
        </div>

        ${tab === 'login' ? html`
          <${Field} label="Student Number or Email" icon="fa-id-card"
            value=${f.id} onChange=${set('id')} placeholder=${'e.g. 21012345 or you@' + EMAIL_DOMAIN} />
          <${Field} label="Password" icon="fa-lock" type="password"
            value=${f.pwd} onChange=${set('pwd')} placeholder="••••••••" />
          <${Btn} onClick=${login} disabled=${busy}>
            <${Icon} name="fa-arrow-right-to-bracket" /> ${busy ? 'Signing in…' : 'Log In'}
          <//>
        ` : html`
          <${Field} label="Student Number" icon="fa-hashtag"
            value=${f.number} onChange=${set('number')} placeholder="e.g. 21012345" />
          <${Field} label="Full Name" icon="fa-user"
            value=${f.name} onChange=${set('name')} placeholder="e.g. Rendani Mulaudzi" />
          <${Field} label="Email Address" icon="fa-envelope" type="email"
            value=${f.email} onChange=${set('email')} placeholder=${'you@' + EMAIL_DOMAIN} />
          <${Field} label="Password" icon="fa-lock" type="password"
            value=${f.p1} onChange=${set('p1')} placeholder="At least 8 characters" />
          <${Field} label="Confirm Password" icon="fa-lock" type="password"
            value=${f.p2} onChange=${set('p2')} placeholder="Repeat your password" />
          <${Btn} kind="gold" onClick=${register} disabled=${busy}>
            <${Icon} name="fa-user-plus" /> ${busy ? 'Creating…' : 'Create Account'}
          <//>
        `}
        <${Status} msg=${msg} />
      </div>
    </div>`;
}

function friendly(e) {
  const m = e.message || String(e);
  if (/Invalid login credentials/i.test(m)) return 'Wrong student number, email or password.';
  if (/Email not confirmed/i.test(m)) return 'Confirm the link in your email first.';
  if (/User already registered/i.test(m)) return 'That email already has an account — log in instead.';
  if (/student_number_key/i.test(m)) return 'That student number already has an account.';
  if (/Failed to fetch/i.test(m)) return 'Cannot reach the server. Check your connection.';
  return m;
}

/** The five-step live check, with the ring the original drew. */
function VerifyOverlay({ steps, readings, unit, onCancel }) {
  const RING = 408;
  const done = steps.filter(s => s.state).length;
  const offset = RING - Math.max(0, Math.min(1, done / steps.length)) * RING;
  const ico = s => s === 'ok' ? 'fa-circle-check'
                 : s === 'warn' ? 'fa-triangle-exclamation'
                 : s === 'bad' ? 'fa-circle-xmark' : 'fa-circle-notch';
  return html`
    <div class="scan-result-overlay">
      <div class="result-card verify-card">
        <div class="vf-dial">
          <div class="vf-sweep" />
          <svg viewBox="0 0 150 150" aria-hidden="true">
            <circle class="vf-ring-bg" cx="75" cy="75" r="65" />
            <circle class="vf-ring-fg" cx="75" cy="75" r="65"
              style=${{ strokeDashoffset: String(offset) }} />
          </svg>
          <div class="vf-core">
            <div class="n">${readings}</div>
            <div class="u">${unit}</div>
          </div>
        </div>
        <h3>Verifying your check-in</h3>
        <p>Stay where you are for a few seconds.</p>
        <div class="vf-checks">
          ${steps.map(s => html`
            <div key=${s.id} class=${'vf-check ' + (s.state || '')}>
              <${Icon} name=${ico(s.state)} />
              <span>${s.label}</span>
              <span class="val">${s.value || ''}</span>
            </div>`)}
        </div>
        <${Btn} kind="ghost" small onClick=${onCancel}>Cancel<//>
      </div>
    </div>`;
}

// ---------------------------------------------------------------- check-in flow

const VF_STEPS = [
  { id: 'signal',    label: 'Reading your location' },
  { id: 'boundary',  label: 'Matching the venue outline' },
  { id: 'stability', label: 'Checking reading stability' },
  { id: 'room',      label: 'Comparing with the room' },
  { id: 'device',    label: 'Confirming device and code' }
];

function useCheckIn() {
  const { profile } = useAuth();
  const [verify, setVerify] = useState(null);     // {steps, readings, unit}
  const [result, setResult] = useState(null);
  const cancelled = useRef(false);

  const run = useCallback(async rawCode => {
    cancelled.current = false;
    const parts = String(rawCode).split('~');
    const sessionId = parts[0].trim();
    const token = parts[1] ? parts[1].trim() : null;

    let steps = VF_STEPS.map(s => ({ ...s, state: null, value: '' }));
    const paint = (patch = {}) => setVerify(v => ({
      steps, readings: 0, unit: 'readings', ...(v || {}), ...patch, steps
    }));
    paint({ readings: 0, unit: 'readings' });

    const mark = (id, state, value) => {
      steps = steps.map(s => s.id === id ? { ...s, state, value } : s);
      paint();
    };

    try {
      const row = await api.session(sessionId);
      if (!row) throw new Error('This code does not match an open session.');
      const session = toEngineSession(row);
      if (session.expiresAt && Date.now() > session.expiresAt)
        throw new Error('This session is no longer accepting check-ins.');

      // --- GPS samples, with the dial counting them in
      const samples = await collectGpsSamples(list =>
        paint({ readings: list.length, unit: 'readings' }));
      if (cancelled.current) { setVerify(null); return; }

      const fix = robustFix(samples);
      paint({ readings: Math.round(fix.accuracy), unit: 'metre accuracy' });
      mark('signal', fix.accuracy <= 35 ? 'ok' : 'warn',
        samples.length + ' · ±' + Math.round(fix.accuracy) + 'm');

      let peerAgg = null;
      try { peerAgg = await api.peerCentroid(sessionId); } catch (e) {}

      const verification = scoreCheckIn({
        fix, samples, session, peerAgg,
        scannedToken: token,
        studentNumber: profile.student_number
      });
      const f = verification.factors;

      await sleep(240);
      mark('boundary', f.containment >= 0.7 ? 'ok' : f.containment >= 0.4 ? 'warn' : 'bad',
        f.distance <= 0 ? 'inside' : f.distance + 'm out');
      await sleep(200);
      mark('stability', f.agreement >= 0.7 ? 'ok' : f.agreement >= 0.4 ? 'warn' : 'bad',
        Math.round(f.agreement * 100) + '% agree');
      await sleep(200);
      mark('room', !f.consensusPeers ? 'warn' : f.consensusScore >= 0.6 ? 'ok' : 'bad',
        f.consensusPeers ? (f.consensusDistance + 'm off') : 'first in');
      await sleep(200);
      mark('device', f.integrity >= 0.9 ? 'ok' : f.integrity >= 0.5 ? 'warn' : 'bad',
        f.presence);
      await sleep(420);
      setVerify(null);

      /* The polygon is the backup, not the gate. A weak fix indoors is the
         expected case, so it no longer refuses the check-in - the record goes
         on at review and the room settles it. Tampering is different: a frozen
         or teleporting feed is a deliberate act and still stops here. */
      const tampered = (verification.flags || [])
        .some(x => x.code === 'frozen' || x.code === 'teleport');
      if (tampered) {
        setResult({ kind: 'fail', title: 'Check-in not accepted', verification,
          text: 'These location readings look artificial rather than weak — ' +
                verification.reasons.slice(0, 2).join(', ') +
                '. Turn off any mock-location app and try again.' });
        return null;
      }

      const res = await api.checkIn(sessionId, {
        status: verification.tier === 'verified' ? 'present' : 'review',
        gps: { lat: fix.lat, lng: fix.lng, accuracy: fix.accuracy },
        verification,
        deviceId: getDeviceId()
      });

      if (res && res.committed === false) {
        setResult({ kind: 'warn', title: 'Already checked in',
          text: 'This session already has a check-in from you.' });
        return null;
      }

      setResult({
        kind: verification.tier === 'verified' ? 'ok' : 'warn',
        title: verification.tier === 'verified' ? 'Checked in' : 'On the register — pending',
        verification,
        text: verification.tier === 'verified'
          ? `You're marked present for ${session.moduleCode || 'this session'} at ${session.venueName || ''}.`
          : 'The location evidence was borderline. Keeping the app listening can settle it without anyone having to judge.'
      });
      return sessionId;
    } catch (e) {
      setVerify(null);
      setResult({ kind: 'fail', title: 'Could not check you in', text: e.message });
      return null;
    }
  }, [profile]);

  const cancel = () => { cancelled.current = true; setVerify(null); };
  return { verify, result, setResult, run, cancel };
}

// ---------------------------------------------------------------- scanner

function ScanScreen({ onBack, onCode }) {
  const [manual, setManual] = useState('');
  const [camErr, setCamErr] = useState(null);
  const scanner = useRef(null);
  const fired = useRef(false);

  useEffect(() => {
    if (typeof Html5Qrcode === 'undefined') { setCamErr('Scanner library unavailable'); return; }
    let s;
    try { s = new Html5Qrcode('reader'); } catch (e) { setCamErr(e.message); return; }
    scanner.current = s;
    s.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 230, height: 230 } },
      text => { if (!fired.current) { fired.current = true; stop().then(() => onCode(text)); } },
      () => {}
    ).catch(e => setCamErr('Camera unavailable — type the session code instead.'));
    return () => { stop(); };
  }, []);

  async function stop() {
    const s = scanner.current;
    scanner.current = null;
    if (!s) return;
    try { await s.stop(); s.clear(); } catch (e) {}
  }

  return html`
    <div class="screen active scan-wrap">
      <div class="scan-step-row">
        <button class="icon-btn" onClick=${() => stop().then(onBack)}>
          <${Icon} name="fa-arrow-left" /></button>
        <span class="scan-step-pill">Scan to Check In</span>
      </div>
      <h3>Scan Session QR</h3>
      <p class="scan-hint">Point your camera at the lecturer's QR code</p>
      <div class="camera-stage">
        <div id="reader" />
        <div class="scan-frame"><div class="scan-line" /></div>
      </div>
      ${camErr && html`<div class="status-msg error">${camErr}</div>`}
      <div class="scan-manual">
        <label>or enter session code</label>
        <div class="input-wrap">
          <input class="input" value=${manual} placeholder="Session ID"
            onChange=${e => setManual(e.target.value)} />
        </div>
        <${Btn} small onClick=${() => manual.trim() && stop().then(() => onCode(manual.trim()))}>
          Look up<//>
      </div>
    </div>`;
}

    <div class="screen active page-pad">
      <div class="topbar">
        <h3>Hi, ${(profile.display_name || '').split(' ')[0] || 'there'}</h3>
        <button class="icon-btn" onClick=${signOut}><${Icon} name="fa-right-from-bracket" /></button>
      </div>

      <div class="greet-card">
        <div class="greet-stats">
          <div class="stat-box"><b>${present}</b><span>present</span></div>
          <div class="stat-box"><b>${records.length}</b><span>records</span></div>
          <div class="stat-box"><b>${enrol.length}</b><span>courses</span></div>
        </div>
      </div>

      <div class="quick-actions">
        <div class="qa-btn" onClick=${() => go('scan')}>
          <${Icon} name="fa-qrcode" /><span>Scan QR</span>
        </div>
        <div class="qa-btn" onClick=${() => go('history')}>
          <${Icon} name="fa-clock-rotate-left" /><span>History</span>
        </div>
      </div>

      <div class="section-title">Open classes</div>
      ${sessions === null
        ? html`<div class="skel" />`
        : sessions.length === 0
          ? html`<div class="empty"><${Icon} name="fa-calendar-xmark" />
                   <h4>Nothing open</h4>
                   <p>${enrol.length ? 'No class is accepting check-ins right now.'
                       : 'You are not on any class list yet — ask your lecturer to add ' +
                         (profile.student_number || 'your student number') + '.'}</p>
                 </div>`
          : sessions.map(s => html`
              <div key=${s.id} class="class-card" onClick=${() => onCheckIn(s.id)}>
                <div>
                  <h4>${(s.aa_courses && s.aa_courses.code) || (s.meta && s.meta.moduleCode) || s.title}</h4>
                  <span>${s.venue || ''}</span>
                </div>
                <span class="session-status live">
                  <${Icon} name="fa-circle" style=${{ fontSize: '.5rem' }} /> LIVE</span>
              </div>`)}
    </div>`;
}

// ---------------------------------------------------------------- history

function History({ onBack }) {
  const [rows, setRows] = useState(null);
  useEffect(() => { api.myAttendance().then(setRows).catch(() => setRows([])); }, []);
  return html`
    <div class="screen active page-pad">
      <div class="topbar">
        <button class="icon-btn" onClick=${onBack}><${Icon} name="fa-arrow-left" /></button>
        <h3>My attendance</h3>
      </div>
      ${rows === null ? html`<div class="skel" />`
        : rows.length === 0
          ? html`<div class="empty"><${Icon} name="fa-clock-rotate-left" />
                   <h4>Nothing yet</h4><p>Your check-ins will appear here.</p></div>`
          : rows.map((r, i) => html`
              <div key=${i} class="history-item">
                <div>
                  <h4>${(r.aa_courses && r.aa_courses.code) || '—'}
                    ${r.aa_class_sessions && r.aa_class_sessions.title
                      ? ' · ' + r.aa_class_sessions.title : ''}</h4>
                  <span>${r.checked_in_at
                    ? new Date(r.checked_in_at).toLocaleString()
                    : (r.aa_class_sessions && r.aa_class_sessions.started_at
                        ? new Date(r.aa_class_sessions.started_at).toLocaleDateString() : '—')}
                    ${r.windows_analysed ? ' · heard in ' + r.windows_present + '/' + r.windows_analysed : ''}
                    ${r.source === 'fused' ? ' · room + location' : r.source === 'acoustic' ? ' · room' : ''}
                  </span>
                </div>
                <${Badge} status=${r.status} />
              </div>`)}
    </div>`;
}

// ---------------------------------------------------------------- the app

function StudentApp() {
  const { profile } = useAuth();
  const [screen, setScreen] = useState('home');
  const { verify, result, setResult, run, cancel } = useCheckIn();
  const [listen, setListen] = useState(null);      // last acoustic state
  const [sessionId, setSessionId] = useState(null);

  const startListening = useCallback(async id => {
    if (!window.uvnAcoustic) return;
    try {
      await window.uvnAcoustic.startListening(id, s => setListen(s));
    } catch (e) {
      setListen(null);
      alert('Microphone unavailable: ' + e.message);
    }
  }, []);

  const stopListening = useCallback(() => {
    if (window.uvnAcoustic) window.uvnAcoustic.stopListening();
    setListen(null);
  }, []);

  useEffect(() => () => stopListening(), [stopListening]);

  const doCheckIn = useCallback(async code => {
    setScreen('home');
    const id = await run(code);
    if (id) {
      setSessionId(id);
      // listening is the main check, so try it without waiting to be asked;
      // browsers that want a fresh gesture fall back to the button
      try { await startListening(id); } catch (e) {}
    }
  }, [run, startListening]);

  return html`
    <${React.Fragment}>
      ${screen === 'home' && html`
        <${StudentHome} go=${setScreen} onCheckIn=${doCheckIn} />`}
      ${screen === 'scan' && html`
        <${ScanScreen} onBack=${() => setScreen('home')} onCode=${doCheckIn} />`}
      ${screen === 'history' && html`
        <${History} onBack=${() => setScreen('home')} />`}

      ${verify && html`<${VerifyOverlay} ...${verify} onCancel=${cancel} />`}
      <${ResultOverlay} result=${result} listening=${!!listen}
        onClose=${() => setResult(null)}
        onListen=${sessionId ? () => startListening(sessionId) : null} />
      <${ListeningBar} state=${listen} onStop=${stopListening} />
    <//>`;
}

function Root() {
  const { loading, user, profile } = useAuth();
  const [role, setRole] = useState(null);

  if (loading) return html`<${Splash} />`;
  if (!user) {
    return role === 'student'
      ? html`<${StudentAuth} onBack=${() => setRole(null)} />`
      : html`<${RolePicker} onStudent=${() => setRole('student')} />`;
  }
  if (!profile) return html`<${FinishProfile} />`;
  if (profile.role !== 'student') {
    return html`
      <div class="screen active auth-screen">
        <div class="form-card">
          <h3>Lecturer account</h3>
          <p class="splash-sub">The lecturer screens are not part of this React
            pass yet — open <b>univen.html</b> for those.</p>
          <${Btn} kind="ghost" onClick=${() => api.signOut()}>Sign out<//>
        </div>
      </div>`;
  }
  return html`<${StudentApp} />`;
}

ReactDOM.createRoot(document.getElementById('root'))
  .render(html`<${AuthProvider}><${Root} /><//>`);

</script>
</body>
</html>
